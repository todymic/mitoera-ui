<header [class.scrolled]="scrolled">
  <div class="wrap nav">
    <a routerLink="/" class="logo">
      <span class="mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="10" width="4" height="8" rx="1"/><rect x="10" y="6" width="4" height="12" rx="1"/><rect x="17" y="10" width="4" height="8" rx="1"/>
        </svg>
      </span>
      <span>Mitoera</span>
    </a>

    <nav class="menu">
      <a routerLink="/pricing" routerLinkActive="active">Pricing</a>
      <a routerLink="/faq" routerLinkActive="active">FAQ</a>
      <a href="https://docs.mitoera.com" target="_blank">Documentation</a>
      <a routerLink="/" fragment="contact">Contact</a>
    </nav>

    <div class="nav-cta">
      <a href="https://bo.mitoera.com/login" class="btn btn-primary">Se connecter</a>
      <button class="burger" [attr.aria-expanded]="menuOpen" aria-label="Menu" (click)="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="menuOpen">
    <a routerLink="/pricing" (click)="closeMenu()">Pricing</a>
    <a routerLink="/faq" (click)="closeMenu()">FAQ</a>
    <a href="https://docs.mitoera.com" target="_blank" (click)="closeMenu()">Documentation</a>
    <a routerLink="/" fragment="contact" (click)="closeMenu()">Contact</a>
    <a href="https://bo.mitoera.com/login" class="btn btn-primary" (click)="closeMenu()">Se connecter</a>
  </div>
</header>
